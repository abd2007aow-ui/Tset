}

  <g id="sunR"><circle cx="540" cy="1150" r="480" fill="url(#glowSun)"/><circle cx="540" cy="1150" r="120" fill="#ffe7a0"/></g>
  ${skyline(1180, "#3a2238", 20)}${palm(90, 1200, .9, "#2a1426")}${palm(1000, 1200, .8, "#2a1426")}
  <g id="soldiers" fill="#2c2a18">${[330, 400, 670, 740].map(x => `<g transform="translate(${x},1335) scale(.34)"><path d="M-60 -470 C-90 -460 -96 -380 -92 -300 L-84 0 L84 0 L92 -300 C96 -380 90 -460 60 -470 Z"/><ellipse cx="0" cy="-540" rx="44" ry="50"/><path d="M-46 -576 Q-46 -640 0 -646 Q46 -640 46 -576 Z" fill="#dcc57a"/><ellipse cx="0" cy="-574" rx="70" ry="14" fill="#c9b26a"/></g>`).join("")}</g>
  <rect y="1330" width="1080" height="590" fill="url(#gRoof)"/>
  <g id="youth">${crowd([[170, 1330, .82, "m"], [270, 1332, .88, "m"], [820, 1332, .86, "m"], [920, 1330, .8, "m"], [1010, 1334, .9, "m"], [70, 1335, .92, "m"]], "#1d0f18")}</g>
  <g id="doves" fill="#fff">${Array.from({ length: 6 }, (_, i) => `<path class="dove" d="M0 0 Q-20 -18 -40 -6 Q-20 -6 0 6 Q20 -6 40 -6 Q20 -18 0 0 Z"/>`).join("")}</g>
  <g id="sonU" transform="translate(470,1350) scale(1.05)">${son("us")}</g>`);
twinkle(rise);
const driveUS = drive(rise.svg, "us", t => ({ sing: true, tilt: k(t, [[39.8, 6], [40.8, -8]]), arm: k(t, [[40.5, 0], [41.2, -160, "back"], [52, -160]]), bo: .2 }));
const youth = [...rise.qa("#youth .cp")], doves = [...rise.qa(".dove")];
reel.on(t => {
  if (!rise.on) return;
  driveUS(t);
  const day = clamp((t - 39.4) / 7);
  rise.q("#dawn").setAttribute("opacity", day.toFixed(3));
  rise.q("#sunR").setAttribute("transform", `translate(0,${(1 - R.ease.out(day)) * 280})`);
  rise.q("#rays").setAttribute("opacity", (clamp((t - 47.0) / 1) * .9).toFixed(2));
  rise.q("#rays").setAttribute("transform", `translate(540,1150) rotate(${t * 4})`);
  rise.qa(".tw").forEach(s => s.style.opacity = 1 - day);
  rise.q("#sonU").setAttribute("transform", `translate(${k(t, [[39.86, 470], [40.7, 530, "out"]])},1350) scale(1.05)`);
  youth.forEach((y, i) => { const [x, yy, s] = y.getAttribute("transform").match(/-?[\d.]+/g).map(Number);
    const p = R.pop(t, 42.84 + i * .22, .5); y._b = y._b || [x, yy, s]; const [bx, by, bs] = y._b; y.setAttribute("transform", `translate(${bx},${by + (1 - clamp(p)) * 140}) scale(${bs})`); y.setAttribute("opacity", clamp(p)); });
  const leave = clamp((t - 45.92) / 2.2);
  rise.q("#soldiers").setAttribute("opacity", (1 - leave).toFixed(2));
  rise.q("#soldiers").setAttribute("transform", `translate(${leave * 40},${leave * 120})`);
  doves.forEach((d, i) => { const p = clamp((t - 47.2 - i * .15) / 4);
    d.setAttribute("transform", `translate(${540 + (i - 2.5) * 40 + p * (i - 2.5) * 160},${1050 - p * 900}) scale(${1 + Math.sin(t * 14 + i) * .25},1)`);
    d.setAttribute("opacity", p > 0 && p < 1 ? 1 : 0); });
});
rise.cam.push([38.9, [540, 1060, 1.1]], [45.9, [540, 1000, 1.03]], [50.4, [540, 990, 1.0]], [52.4, [540, 880, 1.0]]);
reel.cue(42.84, "crowd"); reel.cue(47.22, "rise");

/* =================== 4. Title, notes, lyrics =================== */
R.box(S, 0, 1150, W, 770, { zIndex: 80, background: "linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(6,3,10,.55) 35%, rgba(6,3,10,.72) 100%)" });
const title = R.box(S, 0, 260, W, 360, { zIndex: 85, textAlign: "center", color: "#ffe9b5" });
reel.on(t => {
  const intro = Math.min(R.fade(t, .2, .7), 1 - R.fade(t, 3.3, .5)), outro = R.fade(t, 50.8, .8);
  const html = t < 25 ? `<div style="font:128px Lalezar;line-height:1.15;text-shadow:0 0 36px rgba(255,120,90,.6),0 8px 24px rgba(0,0,0,.7)">جلجل عليّه<br>الرمّان</div>`
    : `<div style="font:128px Lalezar;line-height:1.15;text-shadow:0 0 36px rgba(255,200,110,.7),0 8px 24px rgba(0,0,0,.7)">جلجل عليّه<br>الرمّان</div><div style="font:600 42px 'IBM Plex Sans Arabic';margin-top:6px;text-shadow:0 4px 14px rgba(0,0,0,.8)">أغنية عراقية تراثية · غناء حمزة نمرة</div>`;
  if (title._h !== html) { title.innerHTML = html; title._h = html; }
  title.style.opacity = Math.max(intro, outro);
});
/* the explaining line on top */
const note = R.box(S, 60, 210, W - 120, 120, { zIndex: 86, display: "flex", justifyContent: "center", alignItems: "center" });
const pill = R.el("div", { style: { font: "600 46px 'IBM Plex Sans Arabic'", color: "#fff7e8", background: "rgba(10,5,16,.62)", padding: "14px 34px",
  borderRadius: "40px", border: "2px solid rgba(255,215,122,.5)", textAlign: "center", direction: "rtl" } }, note);
reel.on(t => {
  let cur = null; for (const n of NOTES) if (t >= n[0] && t <= n[1]) cur = n;
  if (!cur || (t < 3.7)) { note.style.opacity = 0; if (!cur) return; }
  if (t < 3.7) { note.style.top = "690px"; } else note.style.top = "210px";
  if (pill.textContent !== cur[2]) pill.textContent = cur[2];
  const o = Math.min(R.fade(t, cur[0], .4), 1 - R.fade(t, cur[1] - .4, .4));
  note.style.opacity = o; note.style.transform = `translateY(${(1 - R.fade(t, cur[0], .5)) * -20}px)`;
});
const lyricBox = R.box(S, 50, 1300, W - 100, 290, { zIndex: 90 });
const lines = LYRICS.map(ln => {
  const row = R.el("div", { style: { position: "absolute", inset: "0", display: "flex", flexWrap: "wrap", justifyContent: "center", alignContent: "center",
    gap: "0 28px", direction: "rtl", font: "116px Lalezar", lineHeight: "1.3" } }, lyricBox);
  return { row, ln, spans: ln.words.map(w => R.el("span", { text: w, style: { display: "inline-block", transformOrigin: "50% 75%" } }, row)) };
});
lines.forEach((l, i) => l.t0 = Math.max(l.ln.times[0] - .5, i ? lines[i - 1].ln.end + .1 : 0));
reel.on(t => {
  for (const { row, spans, ln, t0 } of lines) {
    const o = Math.min(R.fade(t, t0, .35), 1 - R.fade(t, ln.end - .35, .35));
    row.style.opacity = o; row.style.visibility = o <= 0 ? "hidden" : "inherit";
    if (o <= 0) continue;
    row.style.transform = `translateY(${(1 - R.fade(t, t0, .45)) * 30}px)`;
    spans.forEach((sp, i) => {
      const on = t >= ln.times[i] - .05, p = R.pop(t, ln.times[i] - .05, .4);
      sp.style.color = on ? "#ffd77a" : "rgba(255,248,232,.5)";
      sp.style.textShadow = on ? "0 0 30px rgba(255,170,90,.7), 0 6px 18px rgba(0,0,0,.8)" : "0 6px 18px rgba(0,0,0,.8)";
      sp.style.transform = `scale(${1 + .1 * Math.sin(Math.PI * Math.min(p, 1)) * (t < ln.times[i] + .6 ? 1 : 0)})`;
    });
  }
});
const black = R.box(S, 0, 0, W, H, { zIndex: 99, background: "#000" });
reel.on(t => { black.style.opacity = Math.max(1 - R.fade(t, 0, .5), R.fade(t, 52.2, .8)); });
</script>
