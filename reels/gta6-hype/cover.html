<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>غلاف: بعد انطلاق GTA 6</title>
<script src="../../.claude/skills/maven-reels/kit/reel.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>.t{position:absolute;text-align:center;direction:rtl}.h{font-family:Alexandria;font-weight:900;color:#F3EFE6;line-height:1.15}.b{font-family:'IBM Plex Sans Arabic';color:#F3EFE6}.en{direction:ltr;unicode-bidi:isolate;display:inline-block}</style>
</head>
<body>
<script>
/* Reel cover, «نطاق» reel-cover template: 1080x1920, the title in the middle so the profile grid crop (y 240..1680) keeps it. */
const INK = "#0F1420", SIG = "#FFC21A", PAPER = "#F3EFE6", ASH = "#AEB6C6", TECH = "#A99BFF", INK2 = "#171E2E", INK3 = "#222B3F";
const reel = R.reel({ w: 1080, h: 1920, fps: 30, lang: "ar", duration: 1, bg: INK });
reel.ready = () => Promise.all([document.fonts.load("900 100px Alexandria"), document.fonts.load("700 40px 'IBM Plex Sans Arabic'"), document.fonts.ready]);
const S = reel.stage;
const txt = (p, x, y, w, html, st = {}, cls = "t h") => { const d = R.box(p, x, y, w, null, st); d.style.height = "auto"; d.className = cls; d.innerHTML = html; return d; };
const corners = (x, y, w, h, L, th, c = SIG) => {
  R.svg(S, L, L, `<path d="M0 ${th / 2} H${L - th / 2} V${L}" stroke="${c}" stroke-width="${th}" fill="none"/>`, { x: x + w - L, y });
  R.svg(S, L, L, `<path d="M${L} ${L - th / 2} H${th / 2} V0" stroke="${c}" stroke-width="${th}" fill="none"/>`, { x, y: y + h - L });
};
R.box(S, 0, 0, 1080, 1920, { background: `radial-gradient(110% 60% at 50% 45%, ${INK2} 0%, ${INK} 65%)` });
/* top: category badge + logo (inside the grid crop) */
txt(S, 90, 300, 170, "تقنية", { fontSize: "34px", fontWeight: 700, color: INK, background: TECH, borderRadius: "99px", lineHeight: "62px" }, "t b");
const lg = R.box(S, 760, 285, 230, 100); txt(lg, 0, 6, 230, "نطاق", { fontSize: "64px" }); corners(760, 288, 226, 92, 28, 6);
/* the title, inside the frame */
txt(S, 60, 470, 960, `بعد انطلاق <span class="en">GTA 6</span>`, { fontSize: "52px", fontWeight: 700, color: ASH }, "t b");
txt(S, 80, 570, 920, `هل أخذت<br>أكثر من <span style="color:${SIG}">حجمها؟</span>`, { fontSize: "112px", lineHeight: "1.25", whiteSpace: "nowrap" });
corners(50, 555, 980, 330, 90, 16);
/* the two sides of the story */
const card = (x, y, w, html, st) => { const c = R.box(S, x, y, w, 170, { display: "flex", alignItems: "center", justifyContent: "center", gap: "22px", borderRadius: "34px", direction: "rtl", ...st }); c.innerHTML = html; return c; };
card(560, 1000, 430, `<span class="h" style="color:${INK};font-size:110px">99</span><span class="b" style="color:${INK};font-size:34px;font-weight:700;line-height:1.2">من 100<br><span class="en" style="opacity:.6">Metacritic</span></span>`, { background: PAPER });
card(90, 1000, 430, `<span class="b" style="font-size:46px;font-weight:700;line-height:1.3;text-align:center">باگات · كراشات<br><span style="color:${ASH}"><span class="en">30</span> فريم</span></span>`, { background: INK2, border: `4px solid ${ASH}` });
txt(S, 60, 1260, 960, "شنو صار، وشنو يگولون الطرفين", { fontSize: "44px", fontWeight: 500, color: ASH }, "t b");
txt(S, 60, 1560, 960, "@nitaq.news", { fontSize: "36px", fontWeight: 500, color: ASH, direction: "ltr" }, "t b");
</script>
</body>
</html>
