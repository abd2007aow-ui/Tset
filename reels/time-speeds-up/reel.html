<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>لماذا يتسارع عمرنا؟ - Maven Reels</title>
<!-- Style: explainer on paper (see style-card.md). Three fixed bands: title / diagram panel / subtitle.
     Times come from words.js (the voice) when it exists, otherwise from 2.6 words a second. -->
<script src="../../.claude/skills/maven-reels/kit/reel.js"></script>
<script src="words.js" onerror="window.VOICE=null"></script>
<style>
@font-face{font-family:'Amiri';src:url('fonts/Amiri-400.ttf');font-weight:400}
@font-face{font-family:'Amiri';src:url('fonts/Amiri-700.ttf');font-weight:700}
</style>
</head>
<body>
<script>
/* ---- edit these two lines with your channel ---- */
const CREDIT_1 = "عبدالرحمن فؤاد";
const CREDIT_2 = "تابعنا لمزيد من الأسئلة";

/* 1. The script, one subtitle phrase per line */
const SCRIPT = [
  "لماذا نشعر أن عمرنا يتسارع",            // 0
  "كلما تقدمنا في السن؟",                   // 1
  "هل تساءلت يوماً",                        // 2
  "لماذا كانت أيام طفولتنا طويلة،",          // 3
  "وكأن السنة لا تنتهي؟",                   // 4
  "بينما اليوم تمرّ السنة",                  // 5
  "وكأنها دقيقة واحدة!",                    // 6
  "السبب ليس أن الزمن تغيّر،",               // 7
  "بل نحن الذين تغيّرنا.",                   // 8
  "عندما كنا صغاراً، كانت كل تجربة جديدة:",  // 9
  "أول صديق، أول لعبة، أول رحلة،",           // 10
  "وحتى أبسط الأشياء",                      // 11
  "كانت تترك أثراً في ذاكرتنا.",             // 12
  "عقولنا كانت تسجّل تفاصيل كثيرة،",          // 13
  "لذلك عندما نتذكر الماضي",                 // 14
  "نشعر أنه كان طويلاً.",                    // 15
  "أما عندما نكبر، فتتشابه أيامنا:",          // 16
  "نستيقظ، نعمل، ندرس، نعود، وننام…",         // 17
  "ويتكرر المشهد نفسه.",                     // 18
  "فيختصر العقل الأيام المتشابهة،",           // 19
  "فنشعر أن الزمن يركض!",                    // 20
  "وفلسفياً، نحن لا نقيس العمر",              // 21
  "بعدد السنوات فقط،",                       // 22
  "بل بكمية التجارب التي عشناها داخلها.",     // 23
  "ودينياً، تذكّرنا هذه الحقيقة بقيمة العمر؛",  // 24
  "فالوقت الذي يمضي لا يعود،",               // 25
  "وكل يوم هو فرصة جديدة للعمل والتغيير.",    // 26
  "فلا تجعل سنوات عمرك تتشابه",              // 27
  "حتى لا تشعر أنها مرّت دون أن تعيشها.",      // 28
];
const TM = R.timing(SCRIPT, window.VOICE, { wps: 2.6, gap: .4 });
const T = TM.lines;
const W = (line, n) => TM.words[SCRIPT.slice(0, line).reduce((a, l) => a + l.split(/\s+/).length, 0) + n][1];
const LAST = SCRIPT.length - 1;
const END = TM.end + 2.6;
const OUTRO = TM.end + .5;

/* 2. Look: old paper, three bands */
const C = { paper: "#e0d8c7", panel: "#ebe4d4", card: "#f6f0e4", line: "#c9bdaa", ink: "#2b2b2b", grey: "#868379",
  red: "#b5332a", teal: "#1f6f78", blue: "#3d6fb6", yellow: "#f2c94c", purple: "#7b5ea7", skin: "#f0c9a0" };
const SANS = "'IBM Plex Sans Arabic'";
const reel = R.reel({ w: 1080, h: 1920, fps: 30, lang: "ar", duration: END, bg: C.paper });
reel.ready = () => Promise.all([document.fonts.load("700 90px Amiri"), document.fonts.load("400 60px Amiri"),
  document.fonts.load("600 40px 'IBM Plex Sans Arabic'"), document.fonts.ready]);
const S = R.box(reel.stage, 0, 0, 1080, 1920);
const PUNCH = [], SHAKE = [];
const punch = (t, a = .04, d = .35) => PUNCH.push([t, a, d]);
const shake = (t, a = 10, d = .3) => SHAKE.push([t, a, d]);
reel.on(t => {
  let z = 1 + .03 * R.clamp(t / END);                       // slow push-in over the whole reel
  for (const [t0, a, d] of PUNCH) if (t >= t0 && t < t0 + d) z *= 1 + a * Math.sin(Math.PI * (t - t0) / d);
  let sx = 0, sy = 0;
  for (const [t0, a, d] of SHAKE) if (t >= t0 && t < t0 + d) { const f = (1 - (t - t0) / d) * a; sx += Math.sin(t * 95) * f; sy += Math.cos(t * 71) * f; }
  S.style.transformOrigin = "50% 48%";
  S.style.transform = `translate(${sx}px,${sy}px) scale(${z})`;
});

// paper grain + vignette
R.svg(S, 1080, 1920, `<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .22 0"/></filter>
  <filter id="blot"><feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .36  0 0 0 .35 0"/></filter>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3a2e1c" stop-opacity=".28"/></radialGradient>
  <rect width="1080" height="1920" filter="url(#blot)"/><rect width="1080" height="1920" filter="url(#grain)"/><rect width="1080" height="1920" fill="url(#vig)"/>`);

/* floating dust in the light: slow, repeatable */
for (let i = 0; i < 28; i++) {
  const r = 3 + (i * 7) % 6, d = R.box(S, 0, 0, r * 2, r * 2, { borderRadius: "50%", background: "#fff8e6", zIndex: 30,
    boxShadow: "0 0 8px rgba(255,248,230,.8)" });
  const x0 = (i * 397) % 1080, y0 = (i * 613) % 1920, sp = 14 + (i * 5) % 18;
  reel.on(t => { d.style.transform = `translate(${x0 + 30 * R.wob(t, .05, i)}px, ${((y0 - sp * t) % 1920 + 1920) % 1920}px)`;
    d.style.opacity = .18 + .2 * (R.wob(t, .15, i + 3) * .5 + .5); });
}
const txt = (parent, x, y, w, html, style = {}) => {
  const b = R.box(parent, x, y, w, null, { textAlign: "center", ...style });
  b.style.height = "auto"; b.innerHTML = html; return b;
};

/* top band: the fixed question */
txt(S, 0, 205, 1080, "سؤال اليوم", { font: `700 42px Amiri`, color: C.red });
function kinetic(y, words, t0, step) {           // title words slam in one by one
  const b = txt(S, 0, y, 1080, words.map(([w, c]) => `<span style="display:inline-block;color:${c}">${w}</span>`).join(" "),
    { font: `700 104px Amiri`, lineHeight: 1.25, textShadow: "0 3px 0 rgba(80,60,30,.15)" });
  [...b.children].forEach((sp, i) => reel.on(t => {
    const p = R.pop(t, t0 + i * step, .3);
    sp.style.transform = `scale(${1.8 - .8 * p})`; sp.style.opacity = R.clamp(p * 3);
  }));
}
kinetic(262, [["لماذا", C.red], ["يتسارع", C.red], ["عمرنا؟", C.red]], .05, .14);
kinetic(392, [["كلما", C.ink], ["تقدّمنا", C.ink], ["في", C.ink], ["السن؟", C.teal]], .5, .12);
reel.cue(.05, "hit", "title"); punch(.95, .035, .3);

/* signature: the "life bar" fills faster and faster through the whole reel */
const LIFE_END = END - 2.6;
const life = R.box(S, 90, 548, 900, 40);
txt(life, 790, -2, 110, "عمرك", { font: `700 30px ${SANS}`, color: C.ink, textAlign: "right" });
const lifeTrack = R.box(life, 130, 12, 660, 16, { background: "rgba(120,100,70,.18)", borderRadius: "8px", overflow: "hidden" });
const lifeFill = R.box(lifeTrack, 0, 0, 660, 16, { borderRadius: "8px", transformOrigin: "100% 50%" });
const age = txt(life, 0, -2, 120, "", { font: `700 30px ${SANS}`, color: C.red, textAlign: "left" });
const AR = "٠١٢٣٤٥٦٧٨٩";
reel.on(t => {
  const p = Math.pow(R.clamp(t / LIFE_END), 1.7);
  lifeFill.style.transform = `scaleX(${p})`;
  lifeFill.style.background = `linear-gradient(to left, ${C.teal}, ${p > .5 ? C.red : C.teal})`;
  age.textContent = String(Math.round(p * 70)).replace(/\d/g, d => AR[d]) + " سنة";
});


/* middle band: the diagram panel */
const PX = 40, PY = 610, PW = 1000, PH = 750;
const panel = R.box(S, PX, PY, PW, PH, { background: C.panel, border: `2px solid ${C.line}`, borderRadius: "10px",
  boxShadow: "inset 0 0 60px rgba(120,100,70,.12)", overflow: "hidden" });

/* bottom band: subtitle + credits */
const EMPH = { 0: [3, 4], 3: [4], 6: [1, 2], 7: [3], 8: [3], 9: [6], 13: [3, 4], 16: [3, 4], 19: [1], 20: [2, 3],
  22: [1], 23: [1, 2], 24: [4, 5], 25: [3, 4], 26: [3, 4], 27: [4], 28: [7] };
const TEALS = new Set([3, 9, 13, 23, 26, 28]);
const sub = R.box(S, 50, 1390, 980, 160, { display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center",
  font: "400 64px Amiri", color: C.ink, lineHeight: 1.3, flexWrap: "wrap" });
const subLines = SCRIPT.map((l, i) => {
  const first = SCRIPT.slice(0, i).reduce((a, x) => a + x.split(/\s+/).length, 0);
  const box = R.box(sub, 0, 0, 980, 160, { display: "flex", alignItems: "center", justifyContent: "center", flexWrap: "wrap", gap: "0 16px" });
  box.style.position = "absolute";
  const words = l.split(/\s+/).map((w, n) => {
    const em = (EMPH[i] || []).includes(n);
    const sp = R.el("span", { text: w, style: { display: "inline-block", fontWeight: em ? 700 : 400,
      color: em ? (TEALS.has(i) ? C.teal : C.red) : C.ink } }, box);
    return [sp, TM.words[first + n][1], em];
  });
  return [box, words];
});
reel.on(t => {
  let cur = -1; for (let j = 0; j <= LAST; j++) if (t >= T[j] - .05) cur = j;
  if (t >= OUTRO) cur = -1;
  subLines.forEach(([box, words], i) => {
    box.style.visibility = i === cur ? "inherit" : "hidden";
    if (i !== cur) return;
    for (const [sp, at, em] of words) {
      const p = R.pop(t, at - .06, .25);
      sp.style.opacity = .18 + .82 * R.clamp(p * 1.6);
      sp.style.transform = em ? `scale(${1 + .25 * Math.max(0, 1 - Math.abs(t - at - .12) / .25)})` : "";
    }
  });
});
for (const [i, ns] of Object.entries(EMPH)) punch(W(+i, ns[0]), .018, .3);
txt(S, 0, 1552, 1080, CREDIT_1, { font: `600 32px ${SANS}`, color: C.grey });
txt(S, 0, 1598, 1080, CREDIT_2, { font: `600 32px ${SANS}`, color: C.red });

/* ---- small drawing helpers ---- */
const P = (node, t, o = {}) => R.popIn(reel, node, t, { origin: "50% 50%", ...o });
function scene(t0, t1, head) {
  const s = R.box(panel, 0, 0, PW, PH);
  reel.on(t => {
    const a = R.ease.soft(R.fade(t, t0, .35)), b = R.ease.in(R.fade(t, t1 - .25, .25));
    const o = t < t0 || t >= t1 ? 0 : Math.min(a, 1 - b);
    s.style.opacity = o; s.style.visibility = o <= 0 ? "hidden" : "inherit";
    s.style.transform = `translateX(${-90 * (1 - a) + 120 * b}px) rotate(${(1 - a) * -1.2 + b * 1.2}deg)`;
  });
  if (t0 > 0) reel.cue(t0, "whoosh", "scene");
  if (head) P(txt(s, 0, 34, PW, head, { font: `700 44px ${SANS}`, color: C.ink }), t0 + .05, { sound: false });
  return s;
}
function card(parent, x, y, w, h, o = {}) {
  const c = R.box(parent, x, y, w, h, { background: C.card, border: `2px solid ${o.border || C.line}`, borderRadius: "10px",
    boxShadow: "0 4px 10px rgba(80,60,30,.12)" });
  if (o.badge) R.box(c, w - 46, -14, 40, 40, { background: o.badgeColor || C.red, color: "#fff", borderRadius: "8px",
    font: `600 26px ${SANS}`, display: "flex", alignItems: "center", justifyContent: "center" }).textContent = o.badge;
  if (o.title) txt(c, 0, 22, w, o.title, { font: `600 36px ${SANS}`, color: o.titleColor || C.ink });
  return c;
}
function tag(parent, x, y, text, color, filled = true) {
  const b = R.box(parent, x, y, null, null, { background: filled ? color : C.card, color: filled ? "#fff" : color,
    border: `2px solid ${color}`, borderRadius: "8px", padding: "6px 18px", font: `600 30px ${SANS}`, whiteSpace: "nowrap" });
  b.style.width = "auto"; b.style.height = "auto"; b.textContent = text; return b;
}
function sticker(parent, x, y, text) {
  const b = tag(parent, x, y, text, C.yellow);
  Object.assign(b.style, { color: C.ink, border: `3px solid ${C.ink}`, transform: "rotate(-4deg)", font: `700 34px ${SANS}`, borderRadius: "12px" });
  return b;
}
function impact(text, t0, t1, color = C.red) {   // a huge word slams onto the panel
  const veil = R.box(S, PX, PY, PW, PH, { background: "rgba(235,228,212,.86)", borderRadius: "10px", zIndex: 20 });
  const w = R.box(S, PX, PY, PW, PH, { display: "flex", alignItems: "center", justifyContent: "center", zIndex: 21,
    font: `700 190px Amiri`, color, textShadow: "0 8px 0 rgba(80,60,30,.18)", whiteSpace: "nowrap" });
  w.textContent = text;
  reel.on(t => {
    const on = t >= t0 && t < t1;
    const p = R.pop(t, t0, .28), out = R.ease.in(R.fade(t, t1 - .2, .2));
    veil.style.opacity = on ? Math.min(R.fade(t, t0, .12), 1 - out) : 0;
    w.style.visibility = veil.style.visibility = on ? "inherit" : "hidden";
    w.style.opacity = 1 - out;
    w.style.transform = `rotate(-4deg) scale(${(2.6 - 1.6 * p) * (1 - .3 * out)})`;
  });
  reel.cue(t0 + .2, "hit", text); punch(t0 + .2, .06, .35); shake(t0 + .2, 12, .3);
}
function figure(parent, x, feetY, s, color) {   // a flat pictogram person, feet at (x, feetY)
  return R.svg(parent, 120 * s, 260 * s, `<g transform="scale(${s})"><rect x="22" y="96" width="76" height="160" rx="36" fill="${color}" stroke="${C.ink}" stroke-width="4"/>
    <circle cx="60" cy="52" r="40" fill="${C.skin}" stroke="${C.ink}" stroke-width="4"/></g>`, { x: x - 60 * s, y: feetY - 260 * s });
}
let uid = 0;
function clock(parent, x, y, size, keys) {       // keys: hand angle in degrees over time
  const id = "h" + uid++;
  const n = R.svg(parent, size, size, `<g transform="scale(${size / 200})"><circle cx="100" cy="100" r="90" fill="${C.card}" stroke="${C.ink}" stroke-width="7"/>
    ${[...Array(12)].map((_, i) => `<line x1="100" y1="20" x2="100" y2="${i % 3 ? 30 : 38}" stroke="${C.ink}" stroke-width="${i % 3 ? 4 : 7}" transform="rotate(${i * 30} 100 100)"/>`).join("")}
    <line id="${id}m" x1="100" y1="100" x2="100" y2="40" stroke="${C.ink}" stroke-width="8" stroke-linecap="round"/>
    <line id="${id}" x1="100" y1="100" x2="100" y2="30" stroke="${C.red}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="9" fill="${C.red}"/></g>`, { x, y });
  const hand = n.querySelector("#" + id), mins = n.querySelector("#" + id + "m");
  reel.on(t => { const a = R.k(t, keys); hand.setAttribute("transform", `rotate(${a} 100 100)`); mins.setAttribute("transform", `rotate(${a / 12} 100 100)`); });
  return n;
}
function bar(parent, x, y, w, h, color, keys) {  // grows from the right (RTL) by a 0..1 keyframe
  const track = R.box(parent, x, y, w, h, { background: "rgba(120,100,70,.12)", borderRadius: h / 2 + "px", overflow: "hidden" });
  const fill = R.box(track, 0, 0, w, h, { background: color, borderRadius: h / 2 + "px", transformOrigin: "100% 50%" });
  reel.on(t => fill.style.transform = `scaleX(${R.k(t, keys)})`);
  return track;
}
function iconCard(parent, x, y, w, h, icon, label, color) {
  const c = card(parent, x, y, w, h);
  txt(c, 0, 26, w, R.icon(icon, 74, color, 2.2));
  txt(c, 0, h - 64, w, label, { font: `600 32px ${SANS}`, color: C.ink });
  return c;
}

/* fade in from dark like the reference */
const shade = R.box(S, 0, 0, 1080, 1920, { background: "#1c160d", zIndex: 99 });
reel.on(t => shade.style.opacity = .7 * (1 - R.fade(t, 0, .22)));

/* ===== scene 1 (0-1): the clock that speeds up ===== */
{
  const s = scene(0, T[2], "إحساسنا بالزمن");
  const ck = clock(s, 590, 150, 330, [[0, 0], [T[2], 360 * 7, "in"]]);
  const c1 = card(s, 90, 170, 400, 150, { badge: "١", title: "سنة كاملة…" });
  txt(c1, 0, 80, 400, "تمرّ أسرع كل عام", { font: `600 30px ${SANS}`, color: C.grey });
  P(c1, .3, { note: "card" });
  // the speed meter: bars light up one by one
  const m = R.box(s, 160, 400, 260, 230);
  [50, 85, 120, 155, 190].forEach((h, i) => {
    const b = R.box(m, 210 - i * 50, 190 - h, 36, h, { background: C.grey, border: `2px solid ${C.ink}`, borderRadius: "5px" });
    reel.on(t => b.style.background = t >= W(0, 3) + i * .35 ? (i > 2 ? C.red : C.teal) : "#d6cdbb");
  });
  txt(m, 0, 196, 260, "السرعة", { font: `600 30px ${SANS}`, color: C.grey });
  P(sticker(s, 640, 520, "يتسارع؟"), W(0, 3), { note: "sticker" });
}

/* ===== scene 2 (2-6): childhood year vs today's year ===== */
{
  const s = scene(T[2], T[7], `سنة في <span style="color:${C.teal}">الطفولة</span> وسنة <span style="color:${C.red}">اليوم</span>`);
  const kid = figure(s, 840, 330, .62, C.teal); P(kid, W(2, 1), { note: "child" });
  const a = card(s, 60, 150, 600, 180, { badge: "١", badgeColor: C.teal, title: "سنة الطفولة", titleColor: C.teal });
  P(a, W(3, 0));
  bar(a, 40, 95, 520, 34, C.teal, [[W(3, 3), 0], [T[5] - .2, 1, "linear"]]);
  P(tag(s, 90, 345, "لا تنتهي", C.teal, false), W(4, 3));
  const man = figure(s, 840, 660, .9, C.red); P(man, W(5, 1), { note: "adult" });
  const b = card(s, 60, 470, 600, 180, { badge: "٢", title: "سنة اليوم", titleColor: C.red });
  P(b, W(5, 2));
  bar(b, 40, 95, 520, 34, C.red, [[W(5, 3), 0], [W(5, 3) + .35, .08, "out"]]);
  impact("دقيقة!", W(6, 1), T[7] - .15);
}

/* ===== scene 3 (7-8): what changed? ===== */
{
  const s = scene(T[7], T[9], "ما الذي تغيّر؟");
  const ck = clock(s, 620, 170, 260, [[T[7], 0], [T[9], 60, "linear"]]);
  P(ck, T[7] + .1);
  P(tag(s, 650, 460, "الزمن: كما هو", C.teal), W(7, 3), { note: "tag" });
  const me = figure(s, 260, 450, .95, C.red); P(me, W(8, 1));
  P(tag(s, 150, 480, "نحن تغيّرنا", C.red), W(8, 3), { note: "tag" });
}

/* ===== scene 4 (9-15): childhood fills the memory ===== */
{
  const s = scene(T[9], T[16], `<span style="color:${C.teal}">الطفولة</span>: كل يوم تجربة جديدة`);
  const kid = figure(s, 830, 470, .75, C.teal); P(kid, W(9, 1), { note: "child" });
  const firsts = [["أول صديق", C.blue], ["أول لعبة", C.purple], ["أول رحلة", C.red]];
  firsts.forEach(([w, c], i) => P(tag(s, 700, 140 + i * 70, w, c), W(10, i * 2 + 1), { note: "first" }));
  const mem = card(s, 60, 120, 520, 400, { title: "الذاكرة" });
  P(mem, W(9, 4), { note: "memory" });
  // tiles: each new experience is a new colour; they fill faster on "details"
  const cols = [C.teal, C.red, C.blue, C.yellow, C.purple, "#5a9e6f", "#d9844a"];
  const t0 = W(10, 1), t1 = T[12], t2 = W(13, 3);
  for (let i = 0; i < 40; i++) {
    const tile = R.box(mem, 452 - (i % 8) * 58, 90 + Math.floor(i / 8) * 58, 46, 46, { background: cols[(i * 3) % cols.length], borderRadius: "6px", opacity: .9 });
    const at = i < 12 ? t0 + i * (t1 - t0) / 12 : t1 + (i - 12) * (t2 - t1) / 28;
    P(tile, at, { sound: i % 4 === 0, note: "tile" });
  }
  P(tag(s, 380, 440, "تفاصيل كثيرة", C.ink), W(13, 3));
  // the past feels long
  const past = R.box(s, 60, 560, 880, 150);
  P(past, T[14] + .1, { sound: false });
  txt(past, 700, 0, 180, "الماضي", { font: `600 34px ${SANS}`, color: C.ink, textAlign: "right" });
  bar(past, 0, 60, 880, 40, C.teal, [[W(14, 2), 0], [T[16] - .3, 1, "out"]]);
  P(tag(s, 80, 640, "كان طويلاً", C.teal, false), W(15, 3), { note: "tag" });
}

/* ===== scene 5 (16-20): adult days copy each other ===== */
{
  const s = scene(T[16], T[21], `<span style="color:${C.red}">الكِبَر</span>: أيام متشابهة`);
  const row = R.box(s, 0, 140, PW, 240);
  const row2 = R.box(s, 0, 400, PW, 240);
  const days = [["bell", "نستيقظ"], ["store", "نعمل"], ["chart", "ندرس"], ["car", "نعود"], ["home", "ننام"]];
  days.forEach(([ic, lb], i) => {
    const x = 805 - i * 185;
    const dc = iconCard(row, x, 0, 165, 220, ic, lb, C.grey); P(dc, W(16, 3) + i * .1, { sound: i === 0, note: "frames" });
    for (const ch of [...dc.children]) P(ch, W(17, i), { note: "day" });
    const copy = iconCard(row2, x, 0, 165, 220, ic, lb, C.grey); copy.style.opacity = .55;
    P(copy, W(18, 0) + i * .08, { sound: i === 0, note: "repeat" });
  });
  // the mind squeezes the same days into one
  const sq = [[W(19, 0), 1], [W(19, 3), .12, "in"]];
  reel.on(t => { const v = R.k(t, sq); for (const r of [row, row2]) { r.style.transformOrigin = "50% 50%"; r.style.transform = `scaleX(${v})`; r.style.opacity = v < .2 ? 0 : 1; } });
  const one = card(s, 330, 260, 340, 200, { title: "يوم واحد", titleColor: C.red });
  txt(one, 0, 90, 340, "في الذاكرة", { font: `600 32px ${SANS}`, color: C.grey });
  P(one, W(19, 3), { note: "squeeze" });
  const ck = clock(s, 400, 490, 200, [[T[20], 0], [T[21], 360 * 6, "in"]]);
  P(ck, T[20]);
  impact("الزمن يركض!", W(20, 2), T[21] - .1);
}

/* ===== scene 6 (21-23): how do we measure a life? ===== */
{
  const s = scene(T[21], T[24], "كيف نقيس العمر؟");
  const a = card(s, 530, 150, 410, 380, { badge: "١", badgeColor: C.grey, title: "عدد السنوات" });
  P(a, W(21, 3));
  const n = txt(a, 0, 110, 410, "", { font: "700 150px Amiri", color: C.grey });
  R.count(reel, n, [[W(22, 1), 0], [T[23], 40, "out"]], { digits: "arab" });
  txt(a, 0, 300, 410, "سنة", { font: `600 32px ${SANS}`, color: C.grey });
  P(tag(s, 620, 560, "فقط؟", C.red), W(22, 2), { note: "tag" });
  const b = card(s, 60, 150, 410, 380, { badge: "٢", badgeColor: C.teal, title: "كمية التجارب", titleColor: C.teal });
  P(b, W(21, 5));
  [C.teal, C.red, C.blue, C.yellow, C.purple].forEach((c, i) => {
    const h = 70 + i * 35;
    const bb = R.box(b, 300 - i * 58, 320 - h, 44, h, { background: c, borderRadius: "6px", border: `2px solid ${C.ink}` });
    P(bb, W(23, 2) + i * .15, { origin: "50% 100%", sound: i === 0, note: "bars" });
  });
  const ok = R.box(s, 90, 520, 70, 70, { background: C.teal, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" });
  ok.innerHTML = R.icon("check", 46, "#fff", 3);
  P(ok, W(23, 4), { note: "check" });
}

/* ===== scene 7 (24-26): time does not come back ===== */
{
  const s = scene(T[24], T[27], `قيمة <span style="color:${C.red}">العمر</span>`);
  // hourglass: sand runs down from 24 to 26
  const id = "g" + uid++;
  const g = R.svg(s, 260, 400, `<defs><clipPath id="${id}t"><polygon points="40,30 220,30 135,190 125,190"/></clipPath><clipPath id="${id}b"><polygon points="125,210 135,210 220,370 40,370"/></clipPath></defs>
    <rect id="${id}st" x="0" y="30" width="260" height="170" fill="${C.yellow}" clip-path="url(#${id}t)"/>
    <rect id="${id}sb" x="0" y="370" width="260" height="0" fill="${C.yellow}" clip-path="url(#${id}b)"/>
    <line id="${id}s" x1="130" y1="190" x2="130" y2="370" stroke="${C.yellow}" stroke-width="5"/>
    <path d="M40 30 L220 30 L135 200 L220 370 L40 370 L125 200 Z" fill="none" stroke="${C.ink}" stroke-width="7" stroke-linejoin="round"/>
    <rect x="20" y="10" width="220" height="22" rx="8" fill="${C.ink}"/><rect x="20" y="368" width="220" height="22" rx="8" fill="${C.ink}"/>`, { x: 670, y: 150 });
  P(g, T[24] + .15, { note: "hourglass" });
  const st = g.querySelector(`#${id}st`), sb = g.querySelector(`#${id}sb`);
  reel.on(t => { const p = R.k(t, [[W(24, 2), 0], [T[27], .85, "linear"]]); st.setAttribute("y", 30 + 160 * p); st.setAttribute("height", 170 - 160 * p); sb.setAttribute("y", 370 - 150 * p); sb.setAttribute("height", 150 * p); });
  impact("لا يعود", W(25, 3), W(26, 1));
  const sun = card(s, 70, 160, 480, 330, { badge: "✓", badgeColor: C.teal, title: "يوم جديد = فرصة", titleColor: C.teal });
  txt(sun, 0, 90, 480, `<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="120" r="48" fill="${C.yellow}" stroke="${C.ink}" stroke-width="5"/>
    ${[...Array(9)].map((_, i) => `<line x1="100" y1="50" x2="100" y2="28" stroke="${C.ink}" stroke-width="6" stroke-linecap="round" transform="rotate(${-80 + i * 20} 100 120)"/>`).join("")}
    <rect x="10" y="150" width="180" height="50" fill="${C.card}"/><line x1="10" y1="150" x2="190" y2="150" stroke="${C.ink}" stroke-width="5"/></svg>`);
  P(sun, W(26, 2), { note: "sun" });
  P(tag(s, 350, 520, "للعمل", C.blue), W(26, 5), { note: "tag" });
  P(tag(s, 110, 520, "وللتغيير", C.purple), W(26, 6));
}

/* ===== scene 8 (27-28): don't let your days look alike ===== */
{
  const s = scene(T[27], OUTRO, `لا تجعل <span style="color:${C.red}">أيامك</span> تتشابه`);
  const cols = [C.teal, C.red, C.blue, C.yellow, C.purple, "#5a9e6f", "#d9844a"];
  const tFrom = W(28, 2), tTo = W(28, 7);
  for (let i = 0; i < 35; i++) {
    const col = i % 7, r = Math.floor(i / 7);
    const d = R.box(s, 820 - col * 118, 130 + r * 112, 96, 96, { background: "#cfc6b4", border: `2px solid ${C.line}`, borderRadius: "10px" });
    P(d, T[27] + i * .025, { sound: i === 0, note: "grid" });
    const at = tFrom + ((i * 11) % 35) / 35 * (tTo - tFrom);
    reel.on(t => d.style.background = t >= at ? cols[(i * 5) % 7] : "#cfc6b4");
    if (i % 5 === 0) reel.cue(at, "tick", "colour");
  }
  impact("عِشها", W(28, 7), OUTRO, C.teal);
}

/* ===== outro: empty panel + a red stamp, like the reference ===== */
const stamp = R.box(S, 340, 1390, 400, 150, { border: `8px double ${C.red}`, color: C.red, borderRadius: "10px",
  font: `700 92px Amiri`, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(246,240,228,.5)" });
stamp.textContent = "تابعنا";
reel.on(t => {
  const p = R.pop(t, OUTRO + .2, .3);
  stamp.style.visibility = p <= 0 ? "hidden" : "inherit";
  stamp.style.transform = `rotate(-6deg) scale(${2.2 - 1.2 * p})`;
  stamp.style.opacity = R.clamp(p * 2);
});
reel.cue(OUTRO + .5, "land", "stamp");
</script>
</body>
