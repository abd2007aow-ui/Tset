<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>غلاف إيكونومست 2027 - نطاق</title>
<!-- «نطاق» explainer template, v2 (lessons from the GTA 6 insights): one-line hook, the comment ask at ~15 s,
     numbered beats, a 5 s ending. The visual is the cover itself, with a camera that zooms on each symbol.
     Times come from words.js (the voice) when it exists, otherwise from 2.6 words a second. -->
<script src="../../.claude/skills/maven-reels/kit/reel.js"></script>
<script src="words.js" onerror="window.VOICE=null"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  .t { position:absolute; text-align:center; direction:rtl; }
  .h { font-family:Alexandria; font-weight:900; color:#F3EFE6; line-height:1.15; }
  .b { font-family:'IBM Plex Sans Arabic'; color:#F3EFE6; }
  .en { direction:ltr; unicode-bidi:isolate; display:inline-block; }
</style>
</head>
<body>
<script>
/* ---------- brand ---------- */
const INK = "#0F1420", SIG = "#FFC21A", PAPER = "#F3EFE6", ASH = "#AEB6C6", TECH = "#A99BFF";
const INK2 = "#171E2E", INK3 = "#222B3F";
const HANDLE = "@nitaq.news";

const WORLD = "#FF7A93";   /* category colour: عالم */

/* ---------- 1. the script, one beat per line (what the subtitles show; spoken.txt has the same lines with numbers in words) ---------- */
const SCRIPT = [
  "هالغلاف دايرين بيه، ويگولون بيه رموز سرية… خل نفكّه.",                                         // 0  hook
  "هذا عدد سنوي من الإيكونومست، توقعات للسنة الجاية، تطلعه من أربعين سنة.",                           // 1  what it is
  "والحچي إنها مال روتشيلد صار قديم… باعوا حصتهم بـ2026 لملياردير كندي، وأكبر مالك أصلاً من سنين عائلة أنييلي الإيطالية.", // 2
  "أمريكا… سباق على منو يجي بعد ترامب، وولاية ثانية أشرس بالمحاكم والقرارات.",                        // 3  symbol 1
  "الشرق الأوسط… المنطقة بعد حرب إيران، وطرق الطاقة والأكل.",                                         // 4  symbol 2
  "الصين… 2027 موعد حتى يكون جيشها جاهز لتايوان، بس هاي جاهزية، مو خطة أكيدة.",                         // 5  symbol 3
  "الذكاء الاصطناعي… خوف من فقاعة، لأن شركاته دتتديّن بصفقات مو واضحة.",                              // 6  symbol 4
  "الديون… دول غنية دتصرف أكثر من طاقتها، وفوايد ديونها دتصعد.",                                       // 7  symbol 5
  "فرنسا… إذا فازت لوبان، ممكن تهز الشراكة الفرنسية الألمانية اللي ماشية بيها أوروبا.",                 // 8  symbol 6
  "المناخ… سوبر إل نينيو، و2027 ممكن تصير أحر سنة بالتاريخ.",                                         // 9  symbol 7
  "والباقي أخف… إبر التنحيف، صواريخ Starship، وخمسين سنة على ستار وورز.",                              // 10 symbols 8-10
  "يعني الغلاف مو شيفرة… هو مخاوف محللين، ومرات يصيبون ومرات يغلطون. إنت أي رقم تشوفه أخطر؟ اكتبه بالتعليقات.", // 11 ending + ask
];
const TM = R.timing(SCRIPT, window.VOICE, { wps: 2.5, gap: .35 });
const T = TM.lines;
const WORDS_IN = SCRIPT.map(l => l.split(/\s+/).filter(Boolean).length);
const W = (line, n) => TM.words[WORDS_IN.slice(0, line).reduce((a, b) => a + b, 0) + n][1];
const LEND = i => TM.ends[WORDS_IN.slice(0, i + 1).reduce((a, b) => a + b, 0) - 1];
const END = TM.end + 2.4;
const ENDCARD = LEND(11) + .45;

/* ---------- 2. the reel ---------- */
const reel = R.reel({ w: 1080, h: 1920, fps: 30, lang: "ar", duration: END, bg: INK });
const kitReady = reel.ready;
reel.ready = () => Promise.all([kitReady(), document.fonts.load("900 100px Alexandria"), document.fonts.load("800 100px Alexandria"),
  document.fonts.load("700 40px 'IBM Plex Sans Arabic'"), document.fonts.ready]);
const stage = reel.stage;
const { k, pop, fade, clamp, ease } = R;

/* ---------- helpers ---------- */
const txt = (parent, x, y, w, html, style = {}, cls = "t h") => {
  const d = R.box(parent, x, y, w, null, style); d.style.height = "auto"; d.className = cls; d.innerHTML = html; return d;
};
const ICON = {
  pad: '<path d="M6 8h12a4 4 0 0 1 4 4v2.5a3 3 0 0 1-5.4 1.8L15 14H9l-1.6 2.3A3 3 0 0 1 2 14.5V12a4 4 0 0 1 4-4z"/><path d="M7 10.5v3M5.5 12h3M16 11h.01M18 13h.01"/>',
  disc: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M4.5 4.5l15 15"/>',
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>',
  bug: '<rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7V4.5M9.5 4l1.2 2M14.5 4l-1.2 2M8 11H4.5M16 11h3.5M8 15H5M16 15h3"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  gauge: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l-3.5-5"/><path d="M4 20h16"/>',
  trophy: '<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
};
const icon = (n, s, c, sw = 2) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

/* the brand frame: two yellow corners (top-right, bottom-left) that snap in at t0 */
function frame(parent, x, y, w, h, t0, opt = {}) {
  const L = opt.len || 70, th = opt.th || 12, c = opt.color || SIG, gap = opt.gap ?? 0;
  const tr = R.svg(parent, L, L, `<path d="M0 ${th / 2} H${L - th / 2} V${L}" stroke="${c}" stroke-width="${th}" fill="none"/>`, { x: x + w - L + gap, y: y - gap });
  const bl = R.svg(parent, L, L, `<path d="M${L} ${L - th / 2} H${th / 2} V0" stroke="${c}" stroke-width="${th}" fill="none"/>`, { x: x - gap, y: y + h - L + gap });
  reel.on(t => {
    const p = ease.back(clamp((t - t0) / .4));
    const off = (1 - p) * 90;
    tr.style.transform = `translate(${off}px,${-off}px)`; bl.style.transform = `translate(${-off}px,${off}px)`;
    const o = clamp((t - t0) / .12); tr.style.opacity = bl.style.opacity = o;
  });
  return [tr, bl];
}
/* the logo: «نطاق» with its two corners */
function logo(parent, cx, cy, size, t0) {
  const w = size * 2.3, h = size * 1.45;
  const g = R.box(parent, cx - w / 2, cy - h / 2, w, h);
  txt(g, 0, h * .02, w, "نطاق", { fontSize: size + "px", lineHeight: h + "px" });
  frame(g, w * .02, h * .06, w * .96, h * .9, t0 ?? -1, { len: size * .42, th: size * .085 });
  return g;
}
/* a panel = one "shot". Slides in, keeps a slow push, hard-cuts out. */
const panels = [];
function panel(t0, t1, opt = {}) {
  const s = R.box(stage, 0, 0, 1080, 1920, { zIndex: 10, transformOrigin: "50% 45%" });
  const punches = [];
  s.punch = (t, a = .035) => { punches.push([t, a]); return s; };
  reel.on(t => {
    const on = t >= t0 && t < t1;
    s.style.visibility = on ? "inherit" : "hidden";
    if (!on) return;
    const p = t0 <= 0 ? 1 - .0 : ease.soft(clamp((t - t0) / .4));
    let z = 1.05 - .05 * p + .025 * clamp((t - t0) / Math.max(t1 - t0, .1));
    for (const [pt, a] of punches) if (t >= pt && t < pt + .32) z *= 1 + a * Math.sin(Math.PI * (t - pt) / .32);
    s.style.transform = `translateX(${(opt.from ?? -1) * (1 - p) * 90}px) scale(${z})`;
    s.style.opacity = t0 <= 0 ? 1 : clamp((t - t0) / .1);
  });
  reel.cue(t0, "whoosh", "panel");
  panels.push([t0, t1]);
  return s;
}
const popAt = (node, t0, origin = "50% 50%", o = {}) => R.popIn(reel, node, t0, { origin, ...o });
function slideUp(node, t0, d = .35) {
  reel.on(t => { const p = ease.out(clamp((t - t0) / d)); node.style.opacity = p; node.style.transform = `translateY(${(1 - p) * 40}px)`; node.style.visibility = t < t0 ? "hidden" : "inherit"; });
}
/* a strike line across a node at t0 */
function strike(parent, x, y, w, t0) {
  const l = R.box(parent, x, y, w, 10, { background: PAPER, borderRadius: "5px", transformOrigin: "100% 50%" });
  reel.on(t => { const p = ease.out(clamp((t - t0) / .3)); l.style.transform = `scaleX(${p})`; l.style.visibility = t < t0 ? "hidden" : "inherit"; });
  reel.cue(t0, "tick", "strike");
  return l;
}


/* ---------- 3. background: ink with a slow glow ---------- */
{
  const bg = R.box(stage, 0, 0, 1080, 1920, { overflow: "hidden", background: `radial-gradient(120% 70% at 50% 40%, ${INK2} 0%, ${INK} 62%)` });
  const glow = R.box(bg, -200, 500, 1000, 1000, { borderRadius: "50%", background: "radial-gradient(circle, rgba(255,122,147,.07), transparent 65%)" });
  reel.on(t => { glow.style.transform = `translate(${Math.sin(t * .3) * 160}px, ${Math.cos(t * .25) * 90}px)`; });
}

/* ---------- 5. the cover window and its camera ---------- */
const WX = 50, WY = 545, WW = 980, WH = 830;           /* the window on screen */
const IMG_W = 2500, IMG_H = 1308;                      /* cover-src.jpg */
const win = R.box(stage, WX, WY, WW, WH, { borderRadius: "34px", overflow: "hidden", background: "#EFEDEA", boxShadow: "0 40px 90px rgba(0,0,0,.5)", zIndex: 10 });
const img = document.createElement("img");
img.src = "cover-src.jpg";
Object.assign(img.style, { position: "absolute", left: 0, top: 0, width: IMG_W + "px", height: IMG_H + "px", transformOrigin: "0 0" });
win.appendChild(img);
{ const prev = reel.ready; reel.ready = () => Promise.all([prev(), img.decode()]); }
frame(stage, WX, WY, WW, WH, .15, { len: 110, th: 16, gap: 26 }).forEach(n => n.style.zIndex = 12);

/* where each symbol sits on the cover (image px) and how close to go */
const FULL = [1250, 654, .6];
const SYM = [
  { line: 3, at: () => T[3], pos: [1256, 175, 2.4], dot: [1256, 55], title: "أمريكا", sub: "سباق ما بعد ترامب" },
  { line: 4, at: () => T[4], pos: [1400, 940, 1.45], dot: [1660, 900], title: "الشرق الأوسط", sub: "ما بعد حرب إيران · طاقة وأكل" },
  { line: 5, at: () => T[5], pos: [694, 431, 2.6], dot: [694, 420], title: "الصين وتايوان", sub: "2027 موعد جاهزية، مو خطة" },
  { line: 6, at: () => T[6], pos: [1062, 625, 1.7], dot: [1250, 625], title: "الذكاء الاصطناعي", sub: "خوف من فقاعة ديون" },
  { line: 7, at: () => T[7], pos: [1350, 375, 2.6], dot: [1350, 370], title: "الديون", sub: "فوايد دتصعد بالدول الغنية" },
  { line: 8, at: () => T[8], pos: [1600, 644, 1.9], dot: [1790, 720], title: "فرنسا", sub: "انتخابات 2027 ولوبان" },
  { line: 9, at: () => T[9], pos: [706, 656, 2.5], dot: [706, 640], title: "المناخ", sub: "سوبر إل نينيو وأحر سنة؟" },
  { line: 10, at: () => W(10, 2), pos: [1088, 675, 2.5], dot: [1135, 690], title: "إبر التنحيف", sub: "صارت اقتصاد كامل" },
  { line: 10, at: () => W(10, 4), pos: [862, 306, 2.0], dot: [930, 230], title: "الفضاء", sub: `إطلاق أرخص ويه <span class="en">Starship</span>` },
  { line: 10, at: () => W(10, 6), pos: [962, 1072, 2.6], dot: [962, 1075], title: "السينما", sub: "ستار وورز يكمل 50 سنة" },
];
SYM.forEach(s => s.t = s.at());

/* camera keys: hook pull-back, full view, then symbol by symbol, then back to full for the ending */
const camKeys = [[0, [1062, 600, 2.3]], [1.3, FULL, "soft"], [T[3] - .05, [FULL[0], FULL[1], FULL[2] * 1.06], "linear"]];
SYM.forEach((s, i) => {
  const next = i + 1 < SYM.length ? SYM[i + 1].t : T[11];
  camKeys.push([s.t + .45, s.pos, "inOut"], [next - .02, [s.pos[0], s.pos[1], s.pos[2] * 1.07], "linear"]);
});
camKeys.push([T[11] + .6, FULL, "inOut"], [END, [FULL[0], FULL[1], FULL[2] * 1.04], "linear"]);
const camAt = t => R.k(t, camKeys);
reel.on(t => {
  const [cx, cy, z] = camAt(t);
  img.style.transform = `translate(${WW / 2 - cx * z}px, ${WH / 2 - cy * z}px) scale(${z})`;
});
SYM.forEach(s => reel.cue(s.t, "whoosh", s.title));

/* the window dims under the ownership card (line 2) */
const shade = R.box(win, 0, 0, WW, WH, { background: "rgba(15,20,32,.9)" });
reel.on(t => { shade.style.opacity = R.k(t, [[T[2] - .2, 0], [T[2] + .1, 1], [T[3] - .15, 1], [T[3] + .1, 0]]); });

/* ---------- 6. the label area above the window: title + one line ---------- */
function label(t0, t1, title, sub, opt = {}) {
  const box = R.box(stage, 60, 335, 960, 190, { zIndex: 20 });
  const a = txt(box, 0, 0, 960, title, { fontSize: (opt.size || 74) + "px", lineHeight: "1.15", whiteSpace: "nowrap" });
  const b = sub ? txt(box, 0, (opt.size || 74) * 1.2 + 6, 960, sub, { fontSize: "38px", fontWeight: 700, color: ASH }, "t b") : null;
  reel.on(t => {
    const on = t >= t0 && t < t1;
    box.style.visibility = on ? "inherit" : "hidden";
    if (!on) return;
    const p = t0 <= 0 ? 1 : ease.out(clamp((t - t0) / .35));
    box.style.opacity = p; box.style.transform = `translateY(${(1 - p) * 30}px)`;
  });
  return box;
}
label(0, T[1], `غلاف 2027… <span style="color:${SIG}">شيفرة سرية؟</span>`, `إيكونومست · <span class="en">The World Ahead</span>`);
label(T[1], T[2], `<span class="en">The World Ahead</span>`, "توقعات للسنة الجاية، مو نبوءات", { size: 74 });
label(T[2], T[3], "منو يملك إيكونومست؟", "");
SYM.forEach((s, i) => {
  const next = i + 1 < SYM.length ? SYM[i + 1].t : T[11];
  label(s.t, next, `<span style="color:${ASH}">${i + 1} ·</span> ${s.title}`, s.sub);
});
label(T[11], ENDCARD, "مو شيفرة… مخاوف محللين", "مرات يصيبون ومرات يغلطون", { size: 70 });

/* line 1: "annual issue" + "+40 years" chips over the full cover */
{
  const c1 = txt(stage, 90, 1215, 330, "عدد سنوي", { fontSize: "44px", background: PAPER, color: INK, borderRadius: "22px", lineHeight: "92px", zIndex: 22, boxShadow: "0 18px 40px rgba(0,0,0,.35)" });
  const c2 = txt(stage, 660, 1215, 330, "", { fontSize: "44px", background: INK2, color: PAPER, border: `3px solid ${ASH}`, borderRadius: "22px", lineHeight: "86px", zIndex: 22, direction: "ltr", boxShadow: "0 18px 40px rgba(0,0,0,.35)" });
  c2.innerHTML = `+<span class="n">0</span> <span style="direction:rtl;unicode-bidi:isolate">سنة</span>`;
  R.count(reel, c2.querySelector(".n"), [[W(1, 9), 0], [W(1, 11) + .2, 40, "out"]]);
  R.popIn(reel, c1, W(1, 1), { origin: "50% 50%", out: T[2] - .2 });
  R.popIn(reel, c2, W(1, 9), { origin: "50% 50%", out: T[2] - .2 });
}

/* line 2: the ownership card, inside the dimmed window */
{
  const card = R.box(stage, WX + 50, WY + 80, WW - 100, WH - 160, { zIndex: 21, display: "flex", flexDirection: "column", justifyContent: "center", gap: "34px", direction: "rtl" });
  const row = (html, at, st = {}) => {
    const r = R.box(card, 0, 0, WW - 100, 150, { position: "relative", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 40px", boxSizing: "border-box", borderRadius: "28px", background: INK2, border: `3px solid ${INK3}`, ...st });
    r.innerHTML = html; slideUp(r, at); return r;
  };
  const r1 = row(`<span class="h" style="font-size:58px">روتشيلد</span><span class="h en" style="font-size:52px;color:${ASH}">26.9%</span>`, T[2] + .15);
  strike(r1, 40, 70, WW - 180, W(2, 6));
  reel.on(t => { r1.style.opacity = Math.min(+r1.style.opacity || 0, t > W(2, 6) + .2 ? .5 : 1); });
  row(`<span class="b" style="font-size:44px;font-weight:700">باعوها لستيفن سميث · كندا</span><span class="h en" style="font-size:48px;color:${ASH}">2026</span>`, W(2, 9));
  row(`<span class="b" style="font-size:42px;font-weight:700;color:${INK}">أكبر مالك من 2015: أنييلي <span class="en" style="opacity:.6">(Exor)</span></span><span class="h en" style="font-size:52px;color:${INK}">43.4%</span>`, W(2, 11), { background: PAPER, border: `3px solid ${PAPER}` });
  reel.on(t => { card.style.visibility = t >= T[2] && t < T[3] ? "inherit" : "hidden"; });
}

/* the number of the symbol in focus: the one yellow element */
{
  const chip = R.box(stage, WX + WW - 150, WY + 30, 120, 120, { zIndex: 22, borderRadius: "50%", background: SIG, display: "grid", placeItems: "center", boxShadow: "0 14px 30px rgba(0,0,0,.35)" });
  const n = txt(chip, 0, 18, 120, "1", { fontSize: "70px", color: INK, lineHeight: "1", position: "absolute" });
  reel.on(t => {
    let cur = -1; SYM.forEach((s, i) => { if (t >= s.t) cur = i; });
    const on = cur >= 0 && t < T[11];
    chip.style.visibility = on ? "inherit" : "hidden";
    if (!on) return;
    if (n.textContent !== String(cur + 1)) n.textContent = cur + 1;
    const p = R.pop(t, SYM[cur].t + .3, .35);
    chip.style.transform = `scale(${.4 + .6 * p})`;
  });
  SYM.forEach(s => reel.cue(s.t + .3, "pop", "number"));
}

/* the comment ask, early (from symbol 1) and sticky, with "حسب قراءتنا" */
{
  const pill = R.box(stage, WX + 30, WY + WH - 100, 560, 72, { zIndex: 22, display: "flex", alignItems: "center", gap: "14px", padding: "0 26px", boxSizing: "border-box", background: "rgba(15,20,32,.88)", borderRadius: "99px", direction: "rtl" });
  pill.innerHTML = `<span class="b" style="font-size:30px;font-weight:700">اكتب رقم الأخطر 👇</span><span class="b" style="font-size:26px;color:${ASH}">· حسب قراءتنا</span>`;
  R.popIn(reel, pill, T[3] + .5, { origin: "0% 50%", out: T[11] - .1 });
}

/* the ending: every symbol gets its number on the full cover, then the ask, big */
{
  const dots = SYM.map((s, i) => {
    const d = R.box(stage, 0, 0, 64, 64, { zIndex: 21, borderRadius: "50%", background: SIG, display: "grid", placeItems: "center", boxShadow: "0 8px 20px rgba(0,0,0,.35)" });
    txt(d, 0, 9, 64, String(i + 1), { fontSize: "38px", color: INK, lineHeight: "1", position: "absolute" });
    const t0 = T[11] + .6 + i * .09;
    reel.on(t => {
      const [cx, cy, z] = camAt(t);
      const x = WX + WW / 2 + (s.dot[0] - cx) * z - 32, y = WY + WH / 2 + (s.dot[1] - cy) * z - 32;
      d.style.left = x + "px"; d.style.top = y + "px";
      const p = R.pop(t, t0, .3);
      d.style.transform = `scale(${p})`;
      d.style.visibility = t < t0 || t >= ENDCARD ? "hidden" : "inherit";
    });
    reel.cue(t0, "tick", "dot " + (i + 1));
    return d;
  });
  const ask = R.box(stage, 140, WY + WH - 175, 800, 140, { zIndex: 23, display: "flex", alignItems: "center", justifyContent: "center", gap: "22px", background: PAPER, borderRadius: "36px", direction: "rtl", boxShadow: "0 24px 50px rgba(0,0,0,.45)" });
  ask.innerHTML = icon("chat", 70, INK, 2) + `<span class="h" style="color:${INK};font-size:56px">اكتب رقم الأخطر 👇</span>`;
  R.popIn(reel, ask, W(11, 11), { origin: "50% 50%" });
  reel.on(t => { if (t >= ENDCARD) ask.style.visibility = "hidden"; });
}

/* ---------- 4. persistent top bar: logo · series title · category badge ---------- */
const bar = R.box(stage, 60, 200, 960, 100, { zIndex: 40 });
{
  const lg = R.box(bar, 960 - 190, 0, 190, 100);
  logo(lg, 95, 50, 52, .9);
  txt(bar, 260, 30, 480, `غلاف إيكونومست <span class="en">2027</span>`, { fontSize: "34px", fontWeight: 700, color: ASH, lineHeight: "40px" }, "t b");
  const badge = txt(bar, 0, 24, 150, "عالم", { fontSize: "30px", fontWeight: 700, color: INK, background: WORLD, borderRadius: "99px", lineHeight: "54px" }, "t b");
  reel.on(t => { const p = 1; bar.style.opacity = p; bar.style.transform = `translateY(${(1 - p) * -30}px)`; if (t > ENDCARD) bar.style.opacity = 1 - clamp((t - ENDCARD) / .3); });
}

/* end card: the logo on ink (after the last line) */
{
  const s = panel(ENDCARD, END + 1, { from: 0 });
  R.box(s, 0, 0, 1080, 1920, { background: INK });
  logo(s, 540, 860, 190, ENDCARD + .2);
  const tl = txt(s, 60, 1060, 960, "الخبر بكامل نطاقه", { fontSize: "50px", fontWeight: 500, color: ASH }, "t b"); slideUp(tl, ENDCARD + .5);
  const hd = txt(s, 60, 1150, 960, HANDLE, { fontSize: "40px", fontWeight: 500, color: ASH, direction: "ltr" }, "t b"); slideUp(hd, ENDCARD + .7);
}
/* ---------- 6. karaoke subtitles (bottom band) ---------- */
{
  const band = R.box(stage, 90, 1405, 820, 150, { zIndex: 45, display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center", direction: "rtl" });
  const lines = [];
  let c = 0;
  SCRIPT.forEach((l, i) => {
    const ws = l.split(/\s+/).filter(Boolean);
    const div = document.createElement("div"); div.className = "b";
    Object.assign(div.style, { fontSize: "44px", fontWeight: 700, lineHeight: "1.45", position: "absolute", width: "100%", textShadow: "0 3px 14px rgba(0,0,0,.7)" });
    div.innerHTML = ws.map(w => `<span>${/[A-Za-z0-9]/.test(w) && !/[؀-ۿ]/.test(w) ? `<span class="en">${w}</span>` : w}</span>`).join(" ");
    band.appendChild(div);
    lines.push({ div, spans: [...div.children], first: c, start: T[i], stop: i + 1 < SCRIPT.length ? T[i + 1] - .05 : LEND(i) + .5 });
    c += ws.length;
  });
  reel.on(t => {
    for (const L of lines) {
      const on = t >= L.start - .05 && t < L.stop && t < ENDCARD;
      L.div.style.visibility = on ? "inherit" : "hidden";
      if (!on) continue;
      L.div.style.opacity = clamp((t - L.start + .05) / .12);
      L.spans.forEach((sp, j) => { sp.style.color = t >= TM.words[L.first + j][1] - .03 ? PAPER : "rgba(174,182,198,.45)"; });
    }
  });
}
</script>
