    const kiss = k(t, [[48.7, 0], [49.3, 1, "out"], [50.9, 1], [51.6, .3]]);
    return { tilt: 14 + 21 * kiss, hx: 55 * kiss, hy: 46 * kiss, mute: kiss > .9, babyBlink: true, babySleep: kiss > .7 && t < 51.2 };
  }
  return { tilt: 12 + 3 * Math.sin(t * .9), babyBlink: true, babySleep: t > 34.5 && ((t * .5) % 1) < .55 };
});
reel.on(t => {
  if (hold.outer.style.visibility === "hidden") return;
  motherH(t);
  const x = t > 47 ? 470 : k(t, [[22.2, 230], [30.4, 470, "out"]]), sw = Math.sin(t * 1.6);
  hold.q("#holdM").setAttribute("transform", `translate(${x},${1460 + Math.abs(sw) * -6}) rotate(${sw * 2.2}) scale(1.25)`);
  for (const [c, x0, sd, sp] of motes) { const p = (t * .07 * sp + sd / 9) % 1;
    c.setAttribute("cx", (x0 + Math.sin(t * sp + sd) * 30).toFixed(1)); c.setAttribute("cy", (1450 - p * 1300).toFixed(1)); c.setAttribute("opacity", (Math.sin(Math.PI * p) * .7).toFixed(2)); }
  const hp = clamp((t - 49.3) / 1.8);
  heart.setAttribute("opacity", (t > 49.3 && t < 51.2 ? Math.sin(Math.PI * hp) : 0).toFixed(2));
  heart.setAttribute("transform", `translate(${x + 180 * 1.25},${1460 - 560 * 1.25 - hp * 90}) scale(${1.2 + hp})`);
});
twinkle(hold); lampLife(hold);
hold.cam.push([22.2, [500, 960, 1.05]], [30.39, [560, 960, 1.12]], [30.4, [600, 860, 1.75]], [37.4, [610, 850, 1.85]],
  [47.6, [610, 820, 2.5]], [52, [620, 810, 2.8]]);
reel.on(t => { if (t > 47) reel._kissCue || (reel._kissCue = 1, reel.cue(49.3, "kiss")); });

/* --- DESERT: the far wilderness, the sick enemy hobbling alone; the wind takes him (36-42.9) --- */
const des = shot(50, [[36.9, 45.0]]);
des.set(`<rect width="1080" height="1920" fill="url(#gDesertSky)"/>${starsMk(120, 0, 0, 1080, 1000)}${moonMk(300, 420, 90)}
  <path d="${dune(1100, 50, 1)}" fill="#5a3a62"/><path d="${dune(1250, 60, 3)}" fill="#3a2448"/>
  <g id="dEnemy">${enemyMk("de")}</g><g id="dSand"></g><path d="${dune(1420, 50, 5)}" fill="#1a1030"/>
  <rect width="1080" height="1920" fill="#c89a6a" id="storm" opacity="0"/>`);
const dGrains = []; for (let i = 0; i < 90; i++) dGrains.push([R.el("line", { stroke: "#f0cf9e", "stroke-width": 2, "stroke-linecap": "round" }, des.q("#dSand")), rnd() * 1080, 900 + rnd() * 700, rnd() * 9, .6 + rnd()]);
reel.on(t => {
  if (des.outer.style.visibility === "hidden") return;
  const x = 760 - (t - 36.9) * 30, step = Math.sin(t * 3);
  const cough = t > 41.26 && t < 42.5 ? Math.sin(t * 38) * 5 : 0;
  const fadeAway = k(t, [[43.62, 1], [44.4, 0]]);
  const en = des.q("#dEnemy");
  en.setAttribute("transform", `translate(${x + cough},${1262 + Math.sin(x / 300 + 3) * 60 - Math.abs(step) * 4}) scale(1.6)`);
  en.setAttribute("opacity", fadeAway);
  des.q("#debod").setAttribute("transform", `rotate(${-10 - (t > 41.26 && t < 42.5 ? 12 : 0)} 0 0)`);
  des.q("#decane").setAttribute("transform", `rotate(${step * 9} -32 -70)`);
  const gust = t > 43.24 ? 6 : 1.2;
  for (const [l, x0, y0, sd, sp] of dGrains) {
    const gx = ((x0 - t * 80 * sp * gust) % 1080 + 1080) % 1080, gy = y0 + Math.sin(t * 2 + sd) * 20;
    l.setAttribute("x1", gx.toFixed(1)); l.setAttribute("y1", gy.toFixed(1)); l.setAttribute("x2", (gx + 4 + gust * 6).toFixed(1)); l.setAttribute("y2", gy.toFixed(1));
    l.setAttribute("opacity", (.25 + .4 * Math.sin(t + sd) ** 2).toFixed(2));
  }
  des.q("#storm").setAttribute("opacity", k(t, [[43.24, 0], [44.3, .35]]));
});
twinkle(des);
des.cam.push([36.9, [540, 1000, 1.25]], [42.5, [520, 1050, 1.1]], [45, [500, 1050, 1.02]]);
reel.cue(41.26, "cough"); reel.cue(43.24, "wind");

/* --- DREAM: from the sleeping baby's head, a dream of a gazelle and her fawn asleep in the wilds (57-64.2) --- */
const dream = shot(60, [[58.4, 64.4]]);
dream.set(`<rect width="1080" height="1920" fill="url(#gDesertSky)"/>${starsMk(160, 0, 0, 1080, 1100)}${moonMk(540, 520, 130)}
  <path d="${dune(1080, 40, 2)}" fill="#6a4a6e"/><path d="${dune(1180, 30, 4)}" fill="#4a3058"/>
  <g id="grass" fill="#2a1a3a">${Array.from({ length: 40 }, (_, i) => `<path d="M${i * 28} 1200 q6 -50 14 -70 q-2 40 6 70 Z"/>`).join("")}</g>
  <g transform="translate(500,1120)">${gazelleMk("gz", 1.8)}</g><g id="ffl"></g>`);
dream.outer.style.clipPath = "circle(0px at 540px 760px)";
const flies = []; for (let i = 0; i < 30; i++) flies.push([R.el("circle", { r: 3 + rnd() * 4, fill: "#fff0a0", filter: "url(#b3)" }, dream.q("#ffl")), rnd() * 1080, 700 + rnd() * 600, rnd() * 9]);
/* small thought bubbles rising from the baby's head before the dream opens */
const bubbles = R.box(S, 0, 0, W, H, { zIndex: 59 });
const bubSvg = R.svg(bubbles, W, H, [0, 1, 2].map(i => `<circle class="bub" cx="${600 + i * 26}" cy="${930 - i * 70}" r="${14 + i * 10}" fill="#fff6e0" opacity="0"/>`).join(""));
reel.on(t => {
  bubSvg.querySelectorAll(".bub").forEach((b, i) => b.setAttribute("opacity", (t > 58.48 + i * .3 && t < 59.8 + i * .2 ? .75 : 0)));
  if (dream.outer.style.visibility === "hidden") return;
  const r = k(t, [[58.9, 0], [59.6, 230, "back"], [60.5, 260], [61.5, 1300, "inOut"]]);
  const cy = k(t, [[58.9, 640], [60.5, 640], [61.5, 960]]), cx = k(t, [[60.5, 660], [61.5, 540]]);
  dream.outer.style.clipPath = `circle(${r}px at ${cx}px ${cy}px)`;
  dream.q("#gzbreath").setAttribute("transform", `scale(1,${(1 + .03 * Math.sin(t * 1.8)).toFixed(3)})`);
  dream.q("#grass").setAttribute("transform", `skewX(${Math.sin(t * .9) * 3})`);
  for (const [c, x0, y0, sd] of flies) { c.setAttribute("cx", (x0 + Math.sin(t * .7 + sd) * 40).toFixed(1)); c.setAttribute("cy", (y0 + Math.cos(t * .5 + sd) * 30).toFixed(1)); c.setAttribute("opacity", (.3 + .7 * Math.sin(t * 2 + sd) ** 2).toFixed(2)); }
});
twinkle(dream);
dream.cam.push([58.4, [500, 1440, .95]], [60.5, [490, 1430, 1]], [61.5, [540, 1010, 1.1]], [64.4, [540, 1000, 1.04]]);

/* =================== 4. Title, lyrics, finish =================== */
R.box(S, 0, 1150, W, 770, { zIndex: 80, background: "linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(4,2,10,.55) 35%, rgba(4,2,10,.7) 100%)" });
const title = R.box(S, 0, 230, W, 300, { zIndex: 85, textAlign: "center", color: "#ffe9b5" });
title.innerHTML = `<div style="font:170px Lalezar;text-shadow:0 0 40px rgba(255,200,110,.55),0 8px 24px rgba(0,0,0,.7)">دللول</div>
  <div style="font:600 44px 'IBM Plex Sans Arabic';opacity:.85;margin-top:-6px;text-shadow:0 4px 14px rgba(0,0,0,.8)">أمٌّ تغنّي لابنها</div>`;
reel.on(t => { title.style.opacity = Math.max(Math.min(R.fade(t, .3, .8), 1 - R.fade(t, 2.0, .5)), Math.min(R.fade(t, 65.8, .8), 1 - R.fade(t, 67.3, .6))); });

const lyricBox = R.box(S, 50, 1300, W - 100, 290, { zIndex: 90 });
const lines = LYRICS.map(ln => {
  const row = R.el("div", { style: { position: "absolute", inset: "0", display: "flex", flexWrap: "wrap", justifyContent: "center", alignContent: "center",
    gap: "0 28px", direction: "rtl", font: "112px Lalezar", lineHeight: "1.3" } }, lyricBox);
  return { row, ln, spans: ln.words.map(w => R.el("span", { text: w, style: { display: "inline-block", transformOrigin: "50% 75%" } }, row)) };
});
reel.on(t => {
  for (const { row, spans, ln } of lines) {
    const t0 = ln.times[0] - .7, t1 = ln.end, o = Math.min(R.fade(t, t0, .6), 1 - R.fade(t, t1, .7));
    row.style.opacity = o; row.style.visibility = o <= 0 ? "hidden" : "inherit";
    if (o <= 0) continue;
    row.style.transform = `translateY(${(1 - R.fade(t, t0, .8)) * 40 - R.fade(t, t1, .7) * 30}px)`;
    spans.forEach((sp, i) => {
      const on = t >= ln.times[i] - .05, p = R.pop(t, ln.times[i] - .05, .4);
      sp.style.color = on ? "#ffd77a" : "rgba(255,248,232,.5)";
      sp.style.textShadow = on ? "0 0 30px rgba(255,190,90,.7), 0 6px 18px rgba(0,0,0,.8)" : "0 6px 18px rgba(0,0,0,.8)";
      sp.style.transform = `scale(${1 + .1 * Math.sin(Math.PI * Math.min(p, 1)) * (t < ln.times[i] + .6 ? 1 : 0)})`;
    });
  }
});
const black = R.box(S, 0, 0, W, H, { zIndex: 99, background: "#000" });
reel.on(t => { black.style.opacity = Math.max(1 - R.fade(t, 0, .7), R.fade(t, 67.2, .8)); });
</script>
</body>
</html>
