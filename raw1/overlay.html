<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Lalezar;src:url('../.claude/skills/maven-reels/assets/fonts/Lalezar-Regular.ttf')}
@font-face{font-family:Plex;src:url('../.claude/skills/maven-reels/assets/fonts/IBMPlexSansArabic-Regular.ttf');font-weight:400}
@font-face{font-family:Plex;src:url('../.claude/skills/maven-reels/assets/fonts/IBMPlexSansArabic-SemiBold.ttf');font-weight:600}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0;will-change:transform}
.word{width:1080px;text-align:center;font-family:Lalezar;line-height:1;white-space:nowrap;direction:rtl}
.en{font-family:Plex;font-weight:400;letter-spacing:6px;text-transform:lowercase;white-space:nowrap}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.28);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.pill{height:124px;border-radius:62px;display:flex;align-items:center;gap:26px;padding:0 18px 0 44px;direction:rtl;
  font:600 50px Plex;color:#fff;background-color:rgba(14,18,24,.55);white-space:nowrap;overflow:hidden}
.ico{flex:none;width:90px;height:90px;border-radius:50%;border:3px solid #e8b867;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.chip{height:96px;border-radius:48px;padding:0 40px;display:flex;align-items:center;font:600 44px Plex;color:#fff;background-color:rgba(14,18,24,.55);white-space:nowrap}
.title{width:400px;height:112px;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:16px;direction:rtl;white-space:nowrap;
  background:linear-gradient(180deg,#1d1f24,#121317);border:2px solid rgba(232,184,103,.55);
  box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);transform-origin:0 0}
.title b{font:66px Lalezar;color:#f2c46d;line-height:1;padding-top:8px}
.title span{font:600 46px Plex;color:#f4efe8}
.title i{position:absolute;bottom:-2px;left:50%;width:90px;height:4px;margin-left:-45px;border-radius:2px;background:#f2c46d}
.cap{display:inline-flex;align-items:center;gap:18px;height:110px;padding:0 46px;border-radius:55px;font:600 52px Plex;color:#fff;direction:rtl;
  background:rgba(20,16,14,.55);border:2px solid rgba(255,255,255,.3);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.cap::before{content:"";width:16px;height:16px;border-radius:50%;background:#f2c46d;box-shadow:0 0 14px #f2c46d}
</style></head>
<body><div id="stage"></div>
<script src="events.js"></script>
<script>
const W=1080,H=1920,FPS=30, TL=window.TL, HANDLE=(new URLSearchParams(location.search)).get("handle")||"";
const DUR=TL.total;
const stage=document.getElementById("stage");
const mk=(html,cls="")=>{const d=document.createElement("div");d.className="abs "+cls;d.innerHTML=html;stage.appendChild(d);return d};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const PAL={
  orange:{fill:"linear-gradient(180deg,#ffc08a,#f0803f 55%,#d45a22)",glow:"0 0 40px rgba(240,128,63,.45)",en:"#f4a46e"},
  cyan:{fill:"linear-gradient(180deg,#e6fdff,#7fe6ff 50%,#2fb9e0)",glow:"0 0 50px rgba(90,220,255,.75)",en:"#9fe9ff"},
  gold:{fill:"linear-gradient(180deg,#fff1c8,#ffd27a 50%,#d99a35)",glow:"0 0 50px rgba(255,200,100,.7)",en:"#ffd9a0"},
  white:{fill:"linear-gradient(180deg,#ffffff,#e9edf2)",glow:"0 0 30px rgba(255,255,255,.35)",en:"#dfe6ee"},
};
const ICON={
  arrow:`<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#e8b867" stroke-width="2.4" stroke-linecap="round"><path d="M17 17L7 7M7 7v8M7 7h8"/></svg>`,
  return:`<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e8b867" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7.5v9M14.5 9.5c-.5-1-1.4-1.5-2.5-1.5-1.4 0-2.5.8-2.5 1.9 0 2.6 5 1.4 5 4.2 0 1.1-1.1 1.9-2.5 1.9-1.2 0-2.1-.5-2.6-1.5"/></svg>`,
  device:`<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e8b867" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="12" rx="2"/><path d="M9 21h6M12 15v6M8 7h8M8 11h5"/></svg>`,
  laser:`<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e8b867" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/><circle cx="12" cy="12" r="2"/></svg>`,
  wrench:`<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e8b867" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>`,
  calc:`<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e8b867" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h4"/></svg>`,
};
const IG=(c)=>`<svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#962fbf"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".9" fill="${c}" stroke="none"/></svg>`;

/* the camera at output time t: which source rectangle is on screen (matches build.py zoompan) */
function cam(t){
  let s=TL.shots[0]; for(const x of TL.shots){ if(t>=x.t) s=x; else break }
  const z=s.z0+s.dz*clamp((t-s.t)/s.d), k=1.5*z;
  return {k, left:s.cx-360/z, top:s.cy-640/z};
}
/* the old burned-in label sits here; cover it with a solid title card that rides with the camera */
const title=mk(`<b>الرياضيات</b><span>مهمّة</span><i></i>`,"title");
function placeTitle(t){
  const c=cam(t), L=TL.label, w=(L.x1-L.x0)*c.k, h=(L.y1-L.y0)*c.k;
  title.style.transform=`translate(${(L.x0-c.left)*c.k}px,${(L.y0-c.top)*c.k}px) scale(${w/400},${h/112})`;
}
/* full-screen illustrated cutaways */
const SCENE={
clinic:()=>`<svg width="1080" height="1920" viewBox="0 0 1080 1920"><defs>
  <linearGradient id="cw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3ebe2"/><stop offset="1" stop-color="#e2d3c3"/></linearGradient>
  <linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb69d"/><stop offset="1" stop-color="#a88d73"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff3d6" stop-opacity=".95"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b88a5e"/><stop offset="1" stop-color="#8e6542"/></linearGradient>
  <linearGradient id="dev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e0dc"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5a4330" flood-opacity=".28"/></filter>
  <filter id="bl"><feGaussianBlur stdDeviation="16"/></filter></defs>
  <rect width="1080" height="1300" fill="url(#cw)"/><rect y="1300" width="1080" height="620" fill="url(#cf)"/>
  <rect y="1290" width="1080" height="16" fill="#d9c8b6"/>
  ${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${640+i*58}" y="120" width="34" height="1170" rx="6" fill="#e9ddd0"/>`).join("")}
  ${[260,540,820].map((x,i)=>`<g class="lamp" data-i="${i}"><line x1="${x}" y1="0" x2="${x}" y2="250" stroke="#8b7b6b" stroke-width="4"/>
     <circle cx="${x}" cy="300" r="150" fill="url(#glow)" class="lg"/><path d="M${x-80} 300 Q${x} 200 ${x+80} 300 Z" fill="#c9a36b"/></g>`).join("")}
  <g filter="url(#sh)"><circle cx="300" cy="740" r="185" fill="none" stroke="#fff6e4" stroke-width="18"/>
    <circle cx="300" cy="740" r="168" fill="#d8ccbf"/><circle cx="300" cy="740" r="168" fill="url(#glow)" opacity=".35"/></g>
  <circle cx="300" cy="740" r="195" fill="none" stroke="#ffe9b8" stroke-width="10" filter="url(#bl)" class="ring"/>
  <ellipse cx="620" cy="1440" rx="380" ry="40" fill="#7a5f46" opacity=".25"/>
  <g filter="url(#sh)" class="bed">
    <rect x="330" y="1260" width="560" height="120" rx="18" fill="url(#wood)"/>
    <rect x="360" y="1380" width="22" height="70" fill="#6e4f35"/><rect x="838" y="1380" width="22" height="70" fill="#6e4f35"/>
    <path d="M320 1265 L900 1265 Q930 1265 930 1235 L930 1205 Q930 1180 900 1180 L470 1180 L360 1080 Q340 1062 318 1080 L300 1100 Q290 1115 300 1135 Z" fill="#fbf8f4"/>
    <rect x="470" y="1188" width="440" height="10" rx="5" fill="#ece5dc"/></g>
  <g filter="url(#sh)" class="dev">
    <rect x="70" y="1010" width="200" height="420" rx="34" fill="url(#dev)"/>
    <rect x="92" y="1035" width="156" height="118" rx="14" fill="#23303a"/>
    <rect x="110" y="1060" width="90" height="12" rx="6" fill="#f2c46d"/><rect x="110" y="1086" width="120" height="12" rx="6" fill="#7fd0c2" opacity=".8"/>
    <rect x="110" y="1112" width="60" height="12" rx="6" fill="#ffffff" opacity=".5"/>
    <path d="M250 1200 Q340 1180 320 1110" stroke="#cfc9c2" stroke-width="10" fill="none"/>
    <rect x="300" y="1060" width="40" height="70" rx="14" fill="#f4f1ed" transform="rotate(-20 320 1095)"/>
    <circle cx="105" cy="1450" r="18" fill="#5c5046"/><circle cx="235" cy="1450" r="18" fill="#5c5046"/></g>
  <g class="plant"><rect x="935" y="1240" width="120" height="150" rx="20" fill="#e8dccf" filter="url(#sh)"/>
    ${[[-30,-70],[10,-90],[40,-60],[-50,-30],[55,-20],[0,-120]].map(([dx,dy],i)=>`<ellipse cx="${995+dx}" cy="${1200+dy}" rx="26" ry="70" fill="${i%2?'#6f8460':'#83986f'}" transform="rotate(${dx*.8} ${995+dx} ${1200+dy})"/>`).join("")}</g>
  </svg>`,
laser:()=>`<svg width="1080" height="1920" viewBox="0 0 1080 1920"><defs>
  <radialGradient id="lb" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#3a2e27"/><stop offset="1" stop-color="#14100e"/></radialGradient>
  <linearGradient id="ld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d4ce"/></linearGradient>
  <radialGradient id="flash"><stop offset="0" stop-color="#fffbe9"/><stop offset=".35" stop-color="#ffd27a" stop-opacity=".8"/><stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/></radialGradient>
  <filter id="lsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity=".5"/></filter></defs>
  <rect width="1080" height="1920" fill="url(#lb)"/>
  <ellipse cx="540" cy="1560" rx="330" ry="50" fill="#000" opacity=".35"/>
  <g filter="url(#lsh)">
    <rect x="300" y="560" width="440" height="960" rx="70" fill="url(#ld)"/>
    <rect x="340" y="610" width="360" height="300" rx="28" fill="#1e2830"/>
    <text x="680" y="680" text-anchor="end" font-family="Plex" font-weight="600" font-size="34" fill="#f2c46d">LASER</text>
    <rect x="370" y="720" width="300" height="16" rx="8" fill="#2f3b45"/><rect class="lv" x="370" y="720" width="200" height="16" rx="8" fill="#f2c46d"/>
    <rect x="370" y="770" width="300" height="16" rx="8" fill="#2f3b45"/><rect x="370" y="770" width="140" height="16" rx="8" fill="#7fd0c2"/>
    <rect x="370" y="820" width="300" height="16" rx="8" fill="#2f3b45"/><rect x="370" y="820" width="240" height="16" rx="8" fill="#ffffff" opacity=".7"/>
    <circle cx="420" cy="990" r="26" fill="#e9e5e0"/><circle cx="520" cy="990" r="26" fill="#e9e5e0"/><circle cx="620" cy="990" r="26" fill="#f2c46d"/>
    <rect x="360" y="1080" width="320" height="10" rx="5" fill="#e4dfd9"/><rect x="360" y="1120" width="320" height="10" rx="5" fill="#e4dfd9"/>
    <circle cx="360" cy="1540" r="26" fill="#3b332d"/><circle cx="680" cy="1540" r="26" fill="#3b332d"/></g>
  <path d="M740 1180 C 860 1180 900 1080 860 980" stroke="#d6d0c9" stroke-width="16" fill="none" stroke-linecap="round"/>
  <g class="hp" transform="rotate(25 860 900)"><rect x="820" y="820" width="80" height="190" rx="30" fill="url(#ld)" filter="url(#lsh)"/>
    <rect x="830" y="800" width="60" height="40" rx="10" fill="#2a2420"/></g>
  <circle class="fl" cx="820" cy="760" r="160" fill="url(#flash)"/>
  </svg>`,
price:()=>`<svg width="1080" height="1920" viewBox="0 0 1080 1920"><defs>
  <radialGradient id="pb" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#2f2722"/><stop offset="1" stop-color="#110e0c"/></radialGradient>
  <linearGradient id="pl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd98f"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
  <linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c46d" stop-opacity=".35"/><stop offset="1" stop-color="#f2c46d" stop-opacity="0"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#pb)"/>
  <rect x="80" y="520" width="920" height="880" rx="56" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
  <text x="930" y="630" text-anchor="end" font-family="Plex" font-weight="600" font-size="56" fill="#f4efe8">سعر الجلسة</text>
  <text x="150" y="630" font-family="Plex" font-size="38" fill="#ff9a6e">▼</text>
  ${[760,900,1040,1180,1320].map(y=>`<line x1="150" y1="${y}" x2="930" y2="${y}" stroke="rgba(255,255,255,.08)" stroke-width="2"/>`).join("")}
  <path class="area" d="M170 720 L320 770 L470 860 L620 905 L770 1060 L910 1230 L910 1330 L170 1330 Z" fill="url(#pa)"/>
  <path class="line" d="M170 720 L320 770 L470 860 L620 905 L770 1060 L910 1230" fill="none" stroke="url(#pl)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
  <circle class="dot" cx="910" cy="1230" r="20" fill="#ff8a5c"/><circle class="dot2" cx="910" cy="1230" r="20" fill="none" stroke="#ff8a5c" stroke-width="4"/>
  </svg>`,
};

/* build every event */
const KEY_Y=560;
const items=TL.events.map(e=>{
  const o={e};
  if(e.kind==="word"){
    const p=PAL[e.color], s=(e.size||1);
    o.el=mk(`<div class="word" style="font-size:${230*s}px;background:${p.fill};-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(${p.glow.replace(/^0 0 /,'0 0 ')}) drop-shadow(0 8px 16px rgba(0,0,0,.55));padding:20px 0">${e.ar}</div>
      <div class="en" style="position:absolute;left:0;width:1080px;text-align:center;top:${200*s}px;font-size:56px;color:${p.en};opacity:.8;text-shadow:0 2px 12px rgba(0,0,0,.6)">${e.en}</div>`);
    o.y=KEY_Y-115*s;
  }else if(e.kind==="cut"){
    o.el=mk(`<div class="sc" style="width:1080px;height:1920px;overflow:hidden;position:relative">${SCENE[e.scene]()}</div>
      <div style="position:absolute;left:0;top:1600px;width:1080px;text-align:center"><div class="cap">${e.caption}</div></div>`);
    o.svg=o.el.querySelector("svg"); o.capEl=o.el.querySelector(".cap");
  }else if(e.kind==="pill"){
    o.el=mk(`<div class="pill glass"><span>${e.text}</span><div class="ico">${ICON[e.icon]||ICON.arrow}</div></div>`);
  }else if(e.kind==="count"){
    const p=PAL[e.color];
    o.el=mk(`<div style="width:1080px;text-align:center;direction:rtl">
      <div class="chip glass" style="display:inline-flex;height:80px;font-size:40px;padding:0 34px;margin-bottom:6px">${e.tag}</div>
      <div class="num" style="font:200px Lalezar;line-height:1.1;direction:ltr;white-space:nowrap;background:${p.fill};-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(${p.glow}) drop-shadow(0 8px 16px rgba(0,0,0,.6))"></div>
      <div style="font:600 56px Plex;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.7)">${e.label}</div></div>`);
    o.num=o.el.querySelector(".num");
  }else if(e.kind==="chips"){
    o.el=mk(`<div style="width:1080px;display:flex;flex-direction:column;align-items:center;gap:22px;direction:rtl">
      ${e.items.map(x=>`<div class="chip glass"><span style="color:#e8b867;margin-left:18px">÷</span>${x}</div>`).join("")}</div>`);
    o.chips=[...o.el.querySelectorAll(".chip")];
  }else if(e.kind==="versus"){
    o.el=mk(`<div style="width:1080px;display:flex;justify-content:center;gap:40px;direction:rtl">
      <div class="glass vs" style="width:400px;height:250px;border-radius:44px;background-color:rgba(14,18,24,.6);border-color:#e8b867;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
        <div style="font:96px Lalezar;color:#ffd27a">${e.left}</div><div style="font:600 40px Plex;color:#fff">${e.note} ↓</div></div>
      <div class="glass vs" style="width:400px;height:250px;border-radius:44px;background-color:rgba(14,18,24,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:.75">
        <div style="font:96px Lalezar;color:#fff">${e.right}</div><div style="font:600 40px Plex;color:#cfd6de">أغلى</div></div></div>`);
    o.cards=[...o.el.querySelectorAll(".vs")];
  }else if(e.kind==="down"){
    const p=PAL.cyan;
    o.el=mk(`<div style="width:1080px;text-align:center">
      <div style="display:inline-flex;align-items:center;gap:30px;direction:rtl">
        <div class="word" style="width:auto;font-size:230px;background:${p.fill};-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(${p.glow}) drop-shadow(0 8px 16px rgba(0,0,0,.55));padding:20px 0">${e.ar}</div>
        <svg class="arr" width="150" height="220" viewBox="0 0 24 36" fill="none" stroke="#7fe6ff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 20px rgba(90,220,255,.8))"><path d="M12 3v28M3 22l9 10 9-10"/></svg></div>
      <div class="en" style="font-size:56px;color:${p.en};opacity:.8;margin-top:-30px">${e.en} ↓</div></div>`);
    o.arr=o.el.querySelector(".arr"); o.y=KEY_Y-140;
  }
  o.el.style.opacity=0;
  return o;
});
/* lower-third anchor */
const LOW=1330;
function inOut(t,t0,dur,inD=.3,outD=.22){ // returns [in progress, out progress] or null if hidden
  if(t<t0||t>t0+dur)return null;
  return [clamp((t-t0)/inD), clamp((t0+dur-t)/outD)];
}
function seek(t){
  placeTitle(Math.min(t,TL.total-0.001));
  for(const o of items){
    const e=o.e, r=inOut(t,e.t,e.dur);
    if(!r){o.el.style.opacity=0;continue}
    const [a,z]=r, A=ease(a), lt=t-e.t;
    if(e.kind==="word"||e.kind==="down"){
      const s=(1.35-.35*A - .02*(1-z) + .012*Math.min(lt,2.5))*(o.fit||1);
      o.el.style.opacity=Math.min(A,z);
      o.el.style.filter=`blur(${(1-A)*16+(1-z)*10}px)`;
      o.el.style.transform=`translate(0px,${o.y+(1-A)*40}px) scale(${s})`;
      o.el.style.transformOrigin="540px 160px";
      if(o.arr)o.arr.style.transform=`translateY(${Math.sin(lt*6)*10+ (1-A)*-60}px)`;
    }else if(e.kind==="cut"){
      const r2=inOut(t,e.t,e.dur,.28,.28), A2=ease(r2[0]), Z2=ease(r2[1]), p=lt/e.dur;
      o.el.style.opacity=Math.min(A2,Z2);
      o.el.style.filter=`blur(${(1-A2)*10+(1-Z2)*10}px)`;
      o.svg.style.transform=`scale(${1.03+.05*p})`; o.svg.style.transformOrigin="540px 1000px";
      o.capEl.style.transform=`translateY(${(1-back(clamp((lt-.2)/.4)))*60}px)`; o.capEl.style.opacity=ease(clamp((lt-.2)/.3));
      const q=sel=>o.svg.querySelectorAll(sel);
      if(e.scene==="clinic"){
        q(".lg").forEach((g,i)=>g.setAttribute("opacity",ease(clamp((lt-.1-i*.12)/.35))));
        q(".ring").forEach(g=>g.setAttribute("opacity",.6+.4*Math.sin(lt*3)));
        q(".bed,.dev,.plant").forEach((g,i)=>{g.style.transform=`translateY(${(1-ease(clamp((lt-i*.1)/.45)))*40}px)`});
      }else if(e.scene==="laser"){
        const ph=(lt*1.6)%1; q(".fl").forEach(g=>{g.setAttribute("opacity",lt>.5?Math.pow(1-ph,3):0);g.setAttribute("r",60+200*ph)});
        q(".lv").forEach(g=>g.setAttribute("width",80+180*ease(clamp(lt/1.2))));
        q(".hp").forEach(g=>g.setAttribute("transform",`rotate(${25+4*Math.sin(lt*2)} 860 900)`));
      }else if(e.scene==="price"){
        const d=ease(clamp((lt-.25)/1.3));
        q(".line").forEach(g=>g.setAttribute("stroke-dashoffset",1-d));
        q(".area").forEach(g=>g.setAttribute("opacity",d));
        q(".dot").forEach(g=>g.setAttribute("opacity",d>.97?1:0));
        const pu=((lt-1.5)%1+1)%1; q(".dot2").forEach(g=>{g.setAttribute("r",20+40*pu);g.setAttribute("opacity",d>.97?1-pu:0)});
      }
    }else if(e.kind==="pill"){
      const B=back(a);
      o.el.style.opacity=Math.min(A,z);
      const w=o.el.firstElementChild.scrollWidth||600;
      o.el.style.transform=`translate(${540-w/2}px,${LOW+(1-B)*80}px) scale(${.85+.15*B})`;
      o.el.style.transformOrigin=`${w/2}px 62px`;
      o.el.firstElementChild.style.clipPath=`inset(0 ${(1-ease(a*1.2))*45}% 0 ${(1-ease(a*1.2))*45}% round 62px)`;
    }else if(e.kind==="count"){
      const k=ease(clamp(lt/.9));
      o.num.textContent=`${Math.round(e.a*k)} – ${Math.round(e.b*k)}`;
      o.el.style.opacity=Math.min(A,z);
      o.el.style.filter=`blur(${(1-A)*12}px)`;
      o.el.style.transform=`translate(0px,${LOW-210+(1-back(a))*70}px) scale(${o.fit||1})`;
      o.el.style.transformOrigin="540px 200px";
    }else if(e.kind==="chips"){
      o.el.style.opacity=z;
      o.el.style.transform=`translate(0px,${LOW-120}px)`;
      o.chips.forEach((c,i)=>{const p=clamp((lt-e.gaps[i])/.3),B=back(p);c.style.opacity=ease(p);c.style.transform=`translateY(${(1-B)*50}px) scale(${.8+.2*B})`});
    }else if(e.kind==="versus"){
      o.el.style.opacity=z;
      o.el.style.transform=`translate(0px,${LOW-40}px)`;
      o.cards.forEach((c,i)=>{const p=clamp((lt-i*.35)/.35),B=back(p);c.style.opacity=ease(p)*(i?.8:1);c.style.transform=`translateY(${(1-B)*70}px) scale(${.85+.15*B})`});
    }
  }
}
function measure(){ // shrink any headline wider than the safe area (960px)
  for(const o of items){
    const n=o.e.kind==="count"?o.num:o.el.querySelector(".word"); if(!n)continue;
    if(o.e.kind==="count")n.textContent=`${o.e.a} – ${o.e.b}`;
    const r=document.createRange(); r.selectNodeContents(o.e.kind==="down"?o.el.firstElementChild.firstElementChild:n);
    const w=r.getBoundingClientRect().width*(o.e.kind==="word"?1.03:1); o.fit=Math.min(1,960/w);
  }
}
window.reel={W,H,fps:FPS,duration:DUR,seek,ready:()=>Promise.all([document.fonts.load("100px Lalezar"),document.fonts.load("600 40px Plex"),document.fonts.ready]).then(measure)};
</script></body></html>
